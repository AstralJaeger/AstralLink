# Build + Cloudflare Workers (static assets) deploy via ajxhome/platform/cloudflare:
#   - default branch -> production (astraljaeger.dev)
#   - any other branch -> preview version with alias URL (<branch>-ajx-link.<subdomain>.workers.dev)
# Needs CLOUDFLARE_ACCOUNT_ID (group ajxhome/web) and CLOUDFLARE_API_TOKEN (this project).
include:
  - component: $CI_SERVER_FQDN/ajxhome/platform/cloudflare/webapp@0.1.0
    inputs:
      production_url: https://astraljaeger.dev
      image: registry.gitlab.com/ajxhome/platform/cloudflare/node-web:0.1
      lint_command: pnpm lint
