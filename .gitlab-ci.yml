# Builds on every push and deploys to Cloudflare Workers (static assets):
#   - default branch -> production (astraljaeger.dev)
#   - any other branch -> preview version with alias URL (<branch>-ajx-link.<subdomain>.workers.dev)
# Requires CI/CD variables: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
image: node:22

stages: [build, deploy]

.pnpm: &pnpm
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

build:
  stage: build
  <<: *pnpm
  script:
    - pnpm lint
    - pnpm build
  artifacts:
    paths: [dist]
    expire_in: 1 week

deploy:production:
  stage: deploy
  <<: *pnpm
  needs: [build]
  rules:
    - if: $CLOUDFLARE_API_TOKEN && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://astraljaeger.dev
  script:
    - pnpm wrangler deploy --message "$CI_COMMIT_SHORT_SHA $CI_COMMIT_TITLE"

deploy:preview:
  stage: deploy
  <<: *pnpm
  needs: [build]
  rules:
    - if: $CLOUDFLARE_API_TOKEN && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  environment:
    name: preview/$CI_COMMIT_REF_SLUG
    url: $PREVIEW_URL
  script:
    # Uploads a new version without promoting it to production; the alias gives each branch a stable URL.
    - ALIAS=$(echo "$CI_COMMIT_REF_SLUG" | cut -c1-40 | sed 's/-*$//')
    - pnpm wrangler versions upload --preview-alias "$ALIAS" --message "$CI_COMMIT_SHORT_SHA $CI_COMMIT_TITLE" | tee deploy.log
    - echo "PREVIEW_URL=$(grep -oE "https://$ALIAS-ajx-link\.[a-z0-9-]+\.workers\.dev" deploy.log | tail -1)" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
